<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf9fd">
  <meta name="description" content="发现互动设计、异形屏幕定制、创作入门与趣味工具，让创意动起来，让屏幕有个性。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="千机百变 · 官方与伙伴们的创意橱柜">
  <meta property="og:description" content="发现互动作品，交流屏幕定制，学习创作，让设计走进日常。">
  <meta property="og:image" content="https://qu-bl.github.io/one-fuzhu/site/assets/og-v2.png">
  <meta property="og:url" content="https://qu-bl.github.io/one-fuzhu/site/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="千机百变 · 官方与伙伴们的创意橱柜">
  <meta name="twitter:description" content="发现互动作品，交流屏幕定制，学习创作，让设计走进日常。">
  <meta name="twitter:image" content="https://qu-bl.github.io/one-fuzhu/site/assets/og-v2.png">
  <link rel="icon" href="./assets/favicon.svg?v=57" type="image/svg+xml">
  <title>千机百变 · 官方与伙伴们的创意橱柜</title>
  <link rel="stylesheet" href="./styles.css?v=57">
  <script src="./theme.js?v=57"></script>
  <script src="./media.js?v=57" defer></script>
  <script src="./app.js?v=57" defer></script>
</head>
<body>
  <a class="skip-link" href="#showcase">跳到创意橱柜</a>

  <main class="app-page">
    <h1 class="sr-only">千机百变 · 让创意动起来，让屏幕有个性</h1>
    <section class="activity-section" aria-label="探索千机百变">
      <div class="activity-carousel" id="activity-carousel" aria-roledescription="轮播">
        <div class="activity-track" id="activity-track"></div>
        <div class="banner-navigation"><div class="activity-dots" id="activity-dots" aria-label="选择主题"></div></div>
        <p class="sr-only" id="activity-status" aria-live="polite"></p>
      </div>
    </section>

    <section class="showcase-section" id="showcase" aria-labelledby="showcase-title">
      <div class="showcase-header">
        <h2 id="showcase-title">创意橱柜</h2>
        <div class="search-wrap">
          <label class="sr-only" for="case-search">搜索创意案例</label>
          <input id="case-search" type="search" placeholder="搜索案例或伙伴" autocomplete="off">
        </div>
      </div>

      <div class="showcase-toolbar" aria-label="创意案例筛选">
        <div class="category-tabs" id="category-tabs" role="group" aria-label="案例分类"></div>
        <div class="platform-picker" id="platform-picker" data-expanded="false">
          <div class="platform-buttons" id="platform-buttons" role="group" aria-label="按运行平台筛选"></div>
        </div>
      </div>

      <div class="case-grid" id="case-grid" role="list"></div>
      <div class="empty-state" id="empty-state" hidden>
        <strong>没有找到匹配案例</strong>
        <p>换一个关键词或分类试试。</p>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <span>© 2026 千机百变</span>
    <span class="site-footer-sep" aria-hidden="true">·</span>
    <a href="./terms.html">用户协议</a>
  </footer>

  <template id="activity-template">
    <article class="activity-slide">
      <img class="activity-cover" alt="">

      <div class="activity-content">
        <h2></h2>
        <p></p>
        <button class="banner-action" type="button"><span></span></button>
      </div>
    </article>
  </template>

  <template id="case-template">
    <article class="case-card" role="listitem">
      <div class="case-card-trigger" role="button" tabindex="0">
        <span class="case-media"><img loading="lazy" decoding="async" alt=""></span>
        <div class="case-body">
          <div class="case-copy">
            <h3 class="case-title"></h3>
            <p class="case-summary"></p>
          </div>
          <div class="case-platforms" aria-label="支持系统"></div>
          <div class="case-tags" aria-label="关键词"></div>
          <section class="case-details" aria-label="作品详情" hidden>
            <h4 class="case-section-label">详情</h4>
            <p class="case-details-text"></p>
          </section>
          <div class="access-items card-access" aria-label="三方链接与联系方式"></div>
        </div>
      </div>
    </article>
  </template>

  <dialog class="access-dialog" id="access-dialog" aria-labelledby="access-title">
    <div class="access-sheet">
      <header class="access-header">
        <div>
          <h2 id="access-title"></h2>
        </div>
        <button class="dialog-close" type="button" aria-label="关闭">×</button>
      </header>
      <div class="access-media" id="access-media" aria-label="作品预览" hidden></div>
      <p class="access-summary" id="access-summary"></p>
      <div class="access-items" id="access-items" aria-label="平台链接与联系方式"></div>
    </div>
  </dialog>
  <p class="copy-toast" id="copy-toast" role="status" aria-live="polite"></p>
</body>
</html>
