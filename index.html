<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f0ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12110f" media="(prefers-color-scheme: dark)">
  <meta name="description" content="千机百变官方活动，以及官方与伙伴们共同创作的互动案例。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="千机百变 · 官方与伙伴们的创意橱柜">
  <meta property="og:description" content="认识官方计划，发现官方与伙伴们用 Rive 和 JavaScript 创作的不同可能。">
  <meta property="og:image" content="https://qu-bl.github.io/material-jadepool-site/assets/og-v2.png">
  <meta property="og:url" content="https://qu-bl.github.io/material-jadepool-site/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="千机百变 · 官方与伙伴们的创意橱柜">
  <meta name="twitter:description" content="认识官方计划，发现官方与伙伴们用 Rive 和 JavaScript 创作的不同可能。">
  <meta name="twitter:image" content="https://qu-bl.github.io/material-jadepool-site/assets/og-v2.png">
  <link rel="icon" href="./assets/og.png" type="image/png">
  <title>千机百变 · 官方与伙伴们的创意橱柜</title>
  <link rel="stylesheet" href="./styles.css?v=5">
  <script src="./app.js?v=5" defer></script>
</head>
<body>
  <a class="skip-link" href="#showcase">跳到创意橱柜</a>

  <main class="app-page">
    <section class="activity-section" aria-label="千机百变官方与活动">
      <div class="activity-carousel" id="activity-carousel" aria-roledescription="轮播">
        <div class="activity-track" id="activity-track"></div>
        <div class="activity-dots" id="activity-dots" aria-label="选择活动"></div>
        <p class="sr-only" id="activity-status" aria-live="polite"></p>
      </div>
    </section>

    <section class="showcase-section" id="showcase" aria-labelledby="showcase-title">
      <div class="showcase-header">
        <h2 id="showcase-title">创意橱柜</h2>
        <div class="search-wrap">
          <label class="sr-only" for="case-search">搜索创意案例</label>
          <input id="case-search" type="search" placeholder="搜索案例、伙伴或能力" autocomplete="off">
        </div>
      </div>

      <div class="showcase-toolbar" aria-label="创意案例筛选">
        <div class="category-tabs" id="category-tabs" role="group" aria-label="案例分类"></div>
        <div class="platform-buttons" id="platform-buttons" role="group" aria-label="按运行平台筛选"></div>
      </div>

      <div class="case-grid" id="case-grid" role="list"></div>
      <div class="empty-state" id="empty-state" hidden>
        <strong>没有找到匹配案例</strong>
        <p>换一个关键词或分类试试。</p>
      </div>
    </section>

  </main>

  <template id="activity-template">
    <article class="activity-slide">
      <img class="activity-cover" alt="">
      <div class="activity-scrim" aria-hidden="true"></div>
      <div class="activity-content">
        <h3></h3>
        <p></p>
        <a class="banner-action"><span></span><b aria-hidden="true">↗</b></a>
      </div>
    </article>
  </template>

  <template id="case-template">
    <a class="case-card" role="listitem">
      <div class="case-media">
        <img loading="lazy" decoding="async" alt="">
      </div>
      <div class="case-body">
        <div class="case-eyebrow">
          <span class="partner-name"></span>
        </div>
        <h3></h3>
        <p class="case-summary"></p>
        <div class="case-footer">
          <div class="case-platforms"></div>
        </div>
      </div>
    </a>
  </template>
</body>
</html>
